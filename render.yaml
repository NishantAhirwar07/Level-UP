services:
  - type: web
    name: level-up
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app app init-db && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
