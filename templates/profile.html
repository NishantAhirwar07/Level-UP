{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><h1 class="h2 mb-4">Profile & settings</h1><div class="card p-4 mb-4"><form method="post">{{ csrf_token()|safe }}<label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" value="{{ user.full_name }}" required><label class="form-label">User ID</label><input class="form-control mb-3" value="{{ user.user_id }}" disabled><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{ user.email }}" required><p class="small text-secondary">Account created {{ user.created_at.strftime('%Y-%m-%d') }}</p><button class="btn btn-success">Save profile</button></form></div><div class="card p-4"><h2 class="h5">Change password</h2><form method="post" action="{{ url_for('auth.change_password') }}">{{ csrf_token()|safe }}<input class="form-control mb-2" type="password" name="current_password" placeholder="Current password" required><input class="form-control mb-2" type="password" name="new_password" placeholder="New password" minlength="10" required><input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm new password" required><button class="btn btn-outline-success">Change password</button></form></div></div></div>{% endblock %}
